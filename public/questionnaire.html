<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CN178R0FGE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        const targetUrl = "https://forms.gle/BQduAPNC67e2U9YQ7";
        let redirected = false;

        function doRedirect() {
            if (!redirected) {
                redirected = true;
                window.location.href = targetUrl;
            }
        }

        // Send page view and redirect only once the event reaches Google
        gtag('config', 'G-CN178R0FGE', {
            'event_callback': doRedirect
        });

        // Fallback: Redirect after 1.5s if ad-blockers or slow networks block gtag
        setTimeout(doRedirect, 1500);
    </script>

    <!-- Meta refresh fallback for users with JavaScript completely disabled -->
    <noscript>
        <meta http-equiv="refresh" content="2;url=https://forms.gle/BQduAPNC67e2U9YQ7" />
    </noscript>
</head>
