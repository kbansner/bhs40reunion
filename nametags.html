<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BHS '86 Name Tags</title>
    <style>
        @page {
            size: 8.5in 11in;
            margin: 0.75in 0.25in; /* 1-inch top/bottom, 0.25-inch left/right */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Georgia, serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            background-color: #f3f4f6;
        }

        .page {
            width: 8in;
            height: 9in; /* Updated to 9 inches */
            margin: 0.75in auto 0.75in auto; /* 1-inch top and bottom margins */
            background: white;
            display: grid;
            grid-template-columns: 4in 4in;
            grid-template-rows: repeat(3, 3in); /* Updated to 3 inches */
            page-break-after: always;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nametag {
            width: 4in;
            height: 3in;
            position: relative;
            background-image: url('/public/images/name-tag-background.png');
            background-size: cover;
            background-repeat: no-repeat;
            box-sizing: border-box;
            /* Optional: uncomment below to see cut lines while testing */
            /*border: 1px dashed #e5e5e5;*/
        }

        @media print {
            .page {
                margin: 0 auto; /* Removed the 1in top margin here */
                box-shadow: none;
            }
            #loading { display: none; }
            body { background-color: white; }
        }

        /* Portrait Placement */
        .portrait {
            position: absolute;
            right: 0.475in; /* Aligns with the photo box in image_a69cd6.jpg */
            top: 0.9in;
            width: 1.26in;
            height: 1.65in;
            object-fit: cover;
            z-index: 1;
        }

        /* Text Container Placement */
        .text-area {
            position: absolute;
            left: 0.4in;
            bottom: 0.44in;
            width: 1.75in;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /*border: 1px dotted orange;*/
        }

        /* Typography */
        .name {
            font-family: Georgia, serif;
            font-size: 20pt;
            line-height: 1.1;
        }

        /* Guest (+1) Specific Styles */
        .guest-label {
            font-size: 12pt;
            margin-bottom: 2px;
            /*color: #ff3300;*/
        }

        .guest-name {
            font-family: Georgia, serif;
            font-size: 20pt;
            margin-top: 24px;
            font-weight: bold;
            color: #dd2200;
        }
        .grayscale {
            filter: grayscale(100%);
        }
    </style>
</head>
<body>

    <div id="loading" style="text-align: center; padding: 2rem; font-family: sans-serif;">
        Generating Name Tags from Directory Feed...
    </div>

    <div id="print-container"></div>

    <script>
        // Check the URL for the sort parameter
        const urlParams = new URLSearchParams(window.location.search);
        const sortByTicket = urlParams.get('sort') === 'ticket';

        const CONFIG = {
            SHEET_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-xDkTv8aIauGKKuiqZrHiC2RgOw0A4Nw3HnJkYQ3ES5kmbzxXM7mUker_v-WX1rt6rnnBwI6wQvcO/pub?gid=1741366949&single=true&output=csv"
        };

        const PLUS_ONE_COL_INDEX = 22; // Column W
        const TICKET_NUM_COL_INDEX = 23; // Update to match your new Ticket Number column (e.g., Column X)

        document.addEventListener("DOMContentLoaded", loadAndGenerateTags);

        async function loadAndGenerateTags() {
            try {
                const response = await fetch(CONFIG.SHEET_URL);
                const text = await response.text();
                const rows = text.split("\n").slice(1);

                let allTags = [];

                rows.forEach(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"\vert{}"$/g, "").trim());

                    const tickets = parseInt(cols[18]) || 0;
                    if (tickets === 0) return;

                    // Extract the chronoligcal ticket number for sorting
                    const ticketNum = parseInt(cols[TICKET_NUM_COL_INDEX]) || 999999;

                    const displayName = cols[12] || `${cols[1]} ${cols[2]}`;
                    const hasPhoto = cols[21] || "Missing";
                    let photoURL = "";
                    if (hasPhoto !== "Missing" && cols[17] && cols[17].trim() !== "") {
                        photoURL = cols[17].includes("http") ? cols[17] : `/grad-portraits/${cols[17]}`;
                    }
                    const formattedName = displayName.replace(' ', '<br>');

                    // Push Primary Tag
                    allTags.push({
                        isGuest: false,
                        photo: photoURL,
                        formattedName: formattedName,
                        ticketNum: ticketNum // Store for sorting
                    });

                    // Push Guest Tag
                    const plusOneFullName = cols[PLUS_ONE_COL_INDEX];
                    if (tickets > 1 && plusOneFullName && plusOneFullName.trim() !== "") {
                        const guestFirstName = plusOneFullName.trim().split(/\s+/)[0];
                        allTags.push({
                            isGuest: true,
                            photo: photoURL,
                            formattedName: formattedName,
                            guestName: guestFirstName,
                            ticketNum: ticketNum // Share the host's ticket number so they sort together
                        });
                    }
                });

                // Intercept and re-order the array if the URL parameter is present
                if (sortByTicket) {
                    allTags.sort((a, b) => {
                        if (a.ticketNum === b.ticketNum) {
                            // If ticket numbers match, ensure the guest sorts immediately after the primary
                            return a.isGuest ? 1 : -1;
                        }
                        return a.ticketNum - b.ticketNum;
                    });
                }

                renderPages(allTags);

            } catch (e) {
                document.getElementById('loading').innerText = "Error loading data. Check console.";
                console.error("Data load failed", e);
            }
        }

        function renderPages(tags) {
            const container = document.getElementById('print-container');
            let html = '';

            // Break the flattened tags array into chunks of 6
            for (let i = 0; i < tags.length; i += 6) {
                const chunk = tags.slice(i, i + 6);

                // Front Page Grid
                html += '<div class="page">';
                chunk.forEach(tag => {
                    html += buildTagHTML(tag);
                });
                // Fill empty slots if chunk is less than 6
                for(let j = chunk.length; j < 6; j++) { html += '<div class="nametag"></div>'; }
                html += '</div>';

                // Back Page Grid (Mirrored Columns)
                // Standard index: 0, 1, 2, 3, 4, 5
                // Mirrored index: 1, 0, 3, 2, 5, 4
                const mirrorMap = [1, 0, 3, 2, 5, 4];
                html += '<div class="page">';
                mirrorMap.forEach(index => {
                    if (chunk[index]) {
                        html += buildTagHTML(chunk[index]);
                    } else {
                        html += '<div class="nametag"></div>';
                    }
                });
                html += '</div>';
            }

            container.innerHTML = html;
            document.getElementById('loading').style.display = 'none';
        }

        function buildTagHTML(tag) {
            // Only build the img element if a photo URL actually exists
            // If it's a guest tag, append the grayscale class
            const imgClass = tag.isGuest ? "portrait grayscale" : "portrait";
            const imgHTML = tag.photo ? `<img src="${tag.photo}" class="${imgClass}">` : "";

            if (tag.isGuest) {
                return `
                <div class="nametag">
                    ${imgHTML}
                    <div class="text-area">
                        <div class="guest-label">I'm with...</div>
                        <div class="name">${tag.formattedName}</div>
                        <div class="guest-name">${tag.guestName}</div>
                    </div>
                </div>`;
            } else {
                return `
                <div class="nametag">
                    ${imgHTML}
                    <div class="text-area">
                        <div class="name">${tag.formattedName}</div>
                    </div>
                </div>`;
            }
        }
    </script>
</body>
</html>
